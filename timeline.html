<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CI Pipeline Timeline</title>
<style>
  body { margin: 0; padding: 30px 0; background: #F7F9FC; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1400, H = 460;
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

const C = {
  navy: '#003B71', orange: '#F4A800', teal: '#00A99D',
  bg: '#F7F9FC', text: '#1A202C', muted: '#718096',
  white: '#FFFFFF', navyLt: '#1A4F8A',
};

const TL_Y = 230;
const ML = 100, MR = 80;
const RECT_W = 158, RECT_H = 70;
const ABOVE_Y = 82;
const BELOW_Y = 302;

const events = [
  { time: '0:00',  label: 'Pipeline Triggers', sub: 'GitHub Actions cron fires',  color: C.navy,   above: true  },
  { time: '0:30',  label: 'Scraping Begins',    sub: '5 competitors in parallel',  color: C.teal,   above: false },
  { time: '4:00',  label: '50+ URLs Captured',  sub: 'Raw text saved per run',     color: C.orange, above: true  },
  { time: '4:30',  label: 'Delta Report Ready', sub: 'Changes flagged & filtered', color: C.teal,   above: false },
  { time: '5:00',  label: 'AI Analysis Begins', sub: 'Claude reads delta report',  color: C.navy,   above: true  },
  { time: '7:30',  label: 'Summaries Written',  sub: 'ci_report.json updated',     color: C.teal,   above: false },
  { time: '10:00', label: 'Pipeline Complete',  sub: 'Intel pushed to GitHub',     color: C.navy,   above: true  },
];

const span = W - ML - MR;
events.forEach((e, i) => { e.x = ML + i * (span / (events.length - 1)); });

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

// Background
ctx.fillStyle = C.bg;
ctx.fillRect(0, 0, W, H);

// Title
ctx.fillStyle = C.navy;
ctx.font = 'bold 20px Calibri, Arial, sans-serif';
ctx.textAlign = 'center';
ctx.fillText('CI Research Pipeline — End to End  (~10 Minutes)', W/2, 40);

// Scraping duration band
ctx.fillStyle = 'rgba(0,169,157,0.10)';
ctx.fillRect(events[1].x, TL_Y - 16, events[2].x - events[1].x, 32);

// AI analysis duration band
ctx.fillStyle = 'rgba(0,59,113,0.07)';
ctx.fillRect(events[4].x, TL_Y - 16, events[5].x - events[4].x, 32);

// Timeline bar
const grad = ctx.createLinearGradient(ML, 0, W - MR, 0);
grad.addColorStop(0, C.navy);
grad.addColorStop(1, C.navyLt);
ctx.fillStyle = grad;
rr(ML, TL_Y - 5, W - ML - MR - 12, 10, 5);
ctx.fill();

// Arrow
ctx.beginPath();
const ax = W - MR + 6;
ctx.moveTo(ax - 20, TL_Y - 10);
ctx.lineTo(ax, TL_Y);
ctx.lineTo(ax - 20, TL_Y + 10);
ctx.fillStyle = C.navyLt;
ctx.fill();

// Draw events
events.forEach(e => {
  const ex = e.x;
  const ry = e.above ? ABOVE_Y : BELOW_Y;
  const lineY1 = e.above ? ry + RECT_H + 1 : TL_Y + 7;
  const lineY2 = e.above ? TL_Y - 7 : ry - 1;

  // Shadow for rect
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.15)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = e.color;
  rr(ex - RECT_W/2, ry, RECT_W, RECT_H, 7);
  ctx.fill();
  ctx.restore();

  // Dotted line
  ctx.save();
  ctx.setLineDash([3, 4]);
  ctx.strokeStyle = e.color;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.moveTo(ex, lineY1);
  ctx.lineTo(ex, lineY2);
  ctx.stroke();
  ctx.restore();

  // Circle on timeline
  ctx.beginPath();
  ctx.arc(ex, TL_Y, 9, 0, Math.PI * 2);
  ctx.fillStyle = e.color;
  ctx.fill();
  ctx.strokeStyle = C.white;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Time label (opposite side from rect)
  ctx.fillStyle = C.muted;
  ctx.font = 'bold 11px Calibri, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(e.time, ex, e.above ? TL_Y + 24 : TL_Y - 16);

  // Text in rect
  const cy = ry + RECT_H / 2;
  ctx.fillStyle = C.white;
  ctx.font = 'bold 13px Calibri, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(e.label, ex, cy - 7);
  ctx.font = '11px Calibri, Arial, sans-serif';
  ctx.globalAlpha = 0.88;
  ctx.fillText(e.sub, ex, cy + 10);
  ctx.globalAlpha = 1;
});

// Duration labels on bands
ctx.font = '10px Calibri, Arial, sans-serif';
ctx.textAlign = 'center';
ctx.fillStyle = C.teal;
ctx.fillText('← Selenium scraping  (~3.5 min) →', (events[1].x + events[2].x) / 2, TL_Y + 38);
ctx.fillStyle = C.navy;
ctx.globalAlpha = 0.6;
ctx.fillText('← Claude analysis  (~2.5 min) →', (events[4].x + events[5].x) / 2, TL_Y + 38);
ctx.globalAlpha = 1;
</script>
</body>
</html>
