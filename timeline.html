<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CI Pipeline Timeline</title>
<style>
  body { margin: 0; padding: 30px 0; background: #F7F9FC; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1600, H = 600;
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

const C = {
  navy: '#003B71', orange: '#F4A800', teal: '#00A99D',
  bg: '#F7F9FC', text: '#1A202C', muted: '#718096',
  white: '#FFFFFF', navyLt: '#1A4F8A',
};

const TL_Y = 290;
const ML = 100, MR = 100;
const RECT_W = 185, RECT_H = 124;
const ABOVE_Y = 54;
const BELOW_Y = 412;

const events = [
  {
    time: '0:00', icon: '⚡', label: 'Pipeline Triggers',
    subs: ['GitHub Actions cron fires', 'Mon · Wed · Fri  8:30 AM Central', 'Repo checked out, deps installed'],
    color: C.navy, above: true,
  },
  {
    time: '0:30', icon: '🌐', label: 'Scraping Begins',
    subs: ['Selenium headless Chrome launches', 'Stealth patches bypass bot detection', '5 competitor jobs run simultaneously'],
    color: C.teal, above: false,
  },
  {
    time: '4:00', icon: '📥', label: '50+ URLs Captured',
    subs: ['Website · LinkedIn · X · YouTube', 'Analyst coverage · Review sites', 'Raw text saved to data/<competitor>/'],
    color: C.orange, above: true,
  },
  {
    time: '4:30', icon: '🔍', label: 'Delta Report Ready',
    subs: ['Line-by-line diff vs previous run', 'No false positives', 'Only meaningful changes flagged'],
    color: C.teal, above: false,
  },
  {
    time: '5:00', icon: '🤖', label: 'AI Analysis Begins',
    subs: ['Claude reads each competitor delta', 'Finds: new features, pricing shifts,', 'messaging changes, personnel moves'],
    color: C.navy, above: true,
  },
  {
    time: '7:30', icon: '📝', label: 'Summaries Written',
    subs: ['Structured report per competitor', 'Actionable signals highlighted', 'ci_report.json updated'],
    color: C.teal, above: false,
  },
  {
    time: '10:00', icon: '✅', label: 'Pipeline Complete',
    subs: ['All 5 competitor reports ready', 'Committed & pushed to GitHub', 'Available to all 3 AI agents'],
    color: C.navy, above: true,
  },
];

const span = W - ML - MR;
events.forEach((e, i) => { e.x = ML + i * (span / (events.length - 1)); });

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

// Background
ctx.fillStyle = C.bg;
ctx.fillRect(0, 0, W, H);

// Title
ctx.fillStyle = C.navy;
ctx.font = 'bold 21px Calibri, Arial, sans-serif';
ctx.textAlign = 'center';
ctx.fillText('CI Research Pipeline — End to End  (~10 Minutes)', W/2, 38);

// Duration bands
ctx.fillStyle = 'rgba(0,169,157,0.09)';
ctx.fillRect(events[1].x, TL_Y - 18, events[2].x - events[1].x, 36);
ctx.fillStyle = 'rgba(0,59,113,0.06)';
ctx.fillRect(events[4].x, TL_Y - 18, events[5].x - events[4].x, 36);

// Timeline bar
const grad = ctx.createLinearGradient(ML, 0, W - MR, 0);
grad.addColorStop(0, C.navy);
grad.addColorStop(1, C.navyLt);
ctx.fillStyle = grad;
rr(ML, TL_Y - 5, W - ML - MR - 14, 10, 5);
ctx.fill();

// Arrow
ctx.beginPath();
const ax = W - MR + 6;
ctx.moveTo(ax - 22, TL_Y - 10);
ctx.lineTo(ax, TL_Y);
ctx.lineTo(ax - 22, TL_Y + 10);
ctx.fillStyle = C.navyLt;
ctx.fill();

// Events
events.forEach(e => {
  const ex = e.x;
  const ry = e.above ? ABOVE_Y : BELOW_Y;
  const lineY1 = e.above ? ry + RECT_H + 1 : TL_Y + 7;
  const lineY2 = e.above ? TL_Y - 7 : ry - 1;

  // Rect shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.14)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = e.color;
  rr(ex - RECT_W/2, ry, RECT_W, RECT_H, 8);
  ctx.fill();
  ctx.restore();

  // Dotted line
  ctx.save();
  ctx.setLineDash([3, 4]);
  ctx.strokeStyle = e.color;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.65;
  ctx.beginPath();
  ctx.moveTo(ex, lineY1);
  ctx.lineTo(ex, lineY2);
  ctx.stroke();
  ctx.restore();

  // Circle on timeline
  ctx.beginPath();
  ctx.arc(ex, TL_Y, 10, 0, Math.PI * 2);
  ctx.fillStyle = e.color;
  ctx.fill();
  ctx.strokeStyle = C.white;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Time label
  ctx.fillStyle = C.muted;
  ctx.font = 'bold 11px Calibri, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(e.time, ex, e.above ? TL_Y + 27 : TL_Y - 18);

  // Icon
  ctx.font = '18px serif';
  ctx.textAlign = 'center';
  ctx.fillText(e.icon, ex, ry + 22);

  // Title
  ctx.fillStyle = C.white;
  ctx.font = 'bold 13px Calibri, Arial, sans-serif';
  ctx.fillText(e.label, ex, ry + 40);

  // Divider
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ex - RECT_W/2 + 14, ry + 48);
  ctx.lineTo(ex + RECT_W/2 - 14, ry + 48);
  ctx.stroke();

  // Sub lines
  ctx.font = '11px Calibri, Arial, sans-serif';
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = C.white;
  e.subs.forEach((line, li) => {
    ctx.fillText(line, ex, ry + 63 + li * 16);
  });
  ctx.globalAlpha = 1;
});

// Band labels
ctx.font = '10px Calibri, Arial, sans-serif';
ctx.textAlign = 'center';
ctx.fillStyle = C.teal;
ctx.fillText('← Selenium scraping  (~3.5 min) →', (events[1].x + events[2].x) / 2, TL_Y + 46);
ctx.fillStyle = C.navy;
ctx.globalAlpha = 0.5;
ctx.fillText('← Claude AI analysis  (~2.5 min) →', (events[4].x + events[5].x) / 2, TL_Y + 46);
ctx.globalAlpha = 1;
</script>
</body>
</html>
