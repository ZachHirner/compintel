name: URL Health Check

on:
  # Sunday, Tuesday, Thursday at 8:00 AM Central (CDT = UTC-5)
  # Runs the day before each main scrape (Mon/Wed/Fri) for early warning
  schedule:
    - cron: "0 13 * * 0,2,4"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start Xvfb
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
        env:
          DISPLAY: ":99"

      - name: Run URL health check
        id: health
        run: |
          cd $GITHUB_WORKSPACE
          python -m scripts.health_check
        env:
          DISPLAY: ":99"
          PYTHONPATH: ${{ github.workspace }}

      - name: Open GitHub Issue on failure
        if: failure() && steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## URL Health Check Failed\n\n';
            body += 'One or more scraper URLs are broken. The scheduled scrape runs tomorrow — fix these before then.\n\n';

            try {
              const failures = fs.readFileSync('health_check_failures.txt', 'utf8');
              body += '```\n' + failures + '\n```\n';
            } catch (e) {
              body += '_Could not read failure details — check the workflow log._\n';
            }

            body += '\n**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            // Check for existing open health check issue to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'url-health',
            });

            if (existing.data.length > 0) {
              // Update the existing issue with a new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: body,
              });
              console.log('Added comment to existing issue #' + existing.data[0].number);
            } else {
              // Create a new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'URL Health Check Failed — ' + new Date().toISOString().split('T')[0],
                body: body,
                labels: ['url-health'],
              });
              console.log('Created issue #' + issue.data.number);
            }
